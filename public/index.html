<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelKuy — Book Your Court</title>
<link rel="stylesheet" href="css/style.css">
<script src="main.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Padel<span>Kuy</span></div>
        <div id="nav-menu" class="nav-menu"></div>
        <div id="nav-actions" class="login-register">
        <a href="login.html" class="btn">Login</a>
        <a href="register.html" class="btn">Register</a>
        </div>
    </nav>

  <header class="hero">
        <h1>Book your padel court in seconds, not hours.</h1>
        <p>Find open slots near you, lock in your time, and just show up. No phone calls, no group chats.</p>
        
      <div class="search-bar">
          <div class="input-group location-group">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              
              <select id="city-filter">
                  <option value="">Pilih Kota Lokasi...</option>
                  <option value="Bandung">Bandung</option>
                  <option value="Jakarta Selatan">Jakarta Selatan</option>
                  <option value="Jakarta Timur">Jakarta Timur</option>
                  <option value="Jakarta">Jakarta</option>
                  <option value="Surabaya">Surabaya</option>
              </select>
          </div>
        
          <div class="input-group date-group" id="date-picker-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              
              <div id="date-display" class="date-placeholder">Pilih Tanggal Bermain...</div>
              <input type="hidden" id="selected-date">
              
              <div id="custom-calendar-popup" class="calendar-popup">
                  <div class="calendar-header">
                      <button id="prev-month">&lt;</button>
                      <span id="kalender-bulan-tahun"></span>
                      <button id="next-month">&gt;</button>
                  </div>
                  <div id="kalender-grid" class="calendar-grid"></div>
              </div>
          </div>
        
          <button id="search-btn">Search</button>
      </div>
    </header>

  <main>
      <div class="section-header">
          <h2>Venue Tersedia</h2>
          <a href="#">Lihat semua -</a>
      </div>
      <div class="venue-grid"></div>
  </main>

  <footer class="footer">
    <div>© 2026 PadelKuy</div>
    <div>Made by Farras & Royan.</div>
  </footer>

</body>
</html>
