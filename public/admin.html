<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Dashboard — PadelKuy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Padel<span>Kuy</span></div>
    <div id="nav-actions">
        <span class="profile-name" id="admin-name">Memuat...</span>
        <button id="btn-admin-logout" class="btn btn-ghost btn-logout">Logout</button>
    </div>
  </nav>

  <main class="admin-dashboard">

    <section class="admin-panel admin-venue-section">

      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Nama Venue</label>
        <div id="venue-name-text" class="editable-text" contenteditable="true" style="font-size: 24px; font-weight: bold;"></div>
      </div>

      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Kota / Location</label>
        <div id="venue-location-text" class="editable-text" contenteditable="true"></div>
      </div>

      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Harga per Jam (Rp)</label>
        <input id="venue-price" type="number" min="0" step="1000" class="pill-input" style="width:200px; padding:8px;">
      </div>

      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Tag (opsional)</label>
        <div id="venue-tag-text" class="editable-text" contenteditable="true"></div>
      </div>

      <div class="inline-edit-group">
        <label class="section-label">About</label>
        <div id="venue-about-text" class="editable-text" contenteditable="true"></div>
      </div>

      <div class="inline-edit-group" style="margin-top: 32px; margin-bottom: 24px;">
        <label class="section-label">Image Information</label>
        <div class="image-grid">
          <label class="image-slot" data-role="thumbnail">Upload Thumbnail<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
          <label class="image-slot" data-role="main">Upload Main Image<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
          <label class="image-slot" data-role="detail0">Upload Detail Image 1<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
          <label class="image-slot" data-role="detail1">Upload Detail Image 2<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
        </div>
      </div>

      <div class="inline-edit-group group-spaced">
        <label class="section-label">Facility</label>
        <div class="facility-grid" id="facility-container"></div>
        <div style="margin-top: 12px;">
          <input id="facility-input" class="pill-input" placeholder="Ketik fasilitas lalu Enter" style="padding:8px; width:260px;">
        </div>
      </div>

      <label class="section-label court-list-margin">Daftar Lapangan</label>
      <div id="courts-wrapper"></div>
      <button id="btn-add-court" class="dashed-add-btn" style="margin-bottom: 40px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#183988" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </button>

      <div class="save-container">
          <button id="btn-save-venue" class="btn-save-venue">Simpan Perubahan Venue</button>
      </div>
      <p id="admin-msg" style="margin-top:12px;"></p>

    </section>

    <section class="admin-panel admin-bookings-section">
      <h2>Manajemen Pesanan</h2>

      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Semua</button>
        <button class="tab-btn" data-filter="pending">Menunggu Pembayaran</button>
        <button class="tab-btn" data-filter="paid">Lunas</button>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Kode</th>
              <th>Pemesan</th>
              <th>Lapangan</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-bookings-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="admin.js?v=pointc"></script>
</body>
</html>
