<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — PadelKuy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Padel<span>Kuy</span></div>
    <div id="nav-actions">
        <span class="profile-name" id="admin-name">Memuat...</span>
        <button id="btn-admin-logout" class="btn btn-ghost btn-logout">Logout</button>
    </div>
  </nav>

  <main class="admin-dashboard">
    
    <section class="admin-panel admin-venue-section">
      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Nama Venue</label>
        <div id="venue-name-text" class="editable-text" contenteditable="true" style="font-size: 24px; font-weight: bold;">NAMA VENUE</div>
      </div>

      <div class="inline-edit-group" style="margin-bottom: 24px;">
        <label class="section-label">Location</label>
        <div id="venue-location-text" class="editable-text" contenteditable="true">Jl. Surabaya</div>
      </div>
  
      <div class="inline-edit-group">
        <label class="section-label">About</label>
        <div id="venue-about-text" class="editable-text" contenteditable="true">Lorem ipsum dolor sit amet...</div>
      </div>
  
      <div class="inline-edit-group" style="margin-top: 32px; margin-bottom: 24px;">
        <label class="section-label">Image Information</label>
        <div class="image-grid">
          <div class="image-slot" onclick="alert('Buka dialog upload Thumbnail')">Upload Thumbnail</div>
          <div class="image-slot" onclick="alert('Buka dialog upload Main Image')">Upload Main Image</div>
          <div class="image-slot" onclick="alert('Buka dialog upload Detail Image 1')">Upload Detail Image 1</div>
          <div class="image-slot" onclick="alert('Buka dialog upload Detail Image 2')">Upload Detail Image 2</div>
        </div>
      </div>
  
      <div class="inline-edit-group group-spaced">
        <label class="section-label">Facility</label>
        <div class="facility-grid" id="facility-container">
          <div class="editable-text facility-item" contenteditable="true">Shower</div>
          
          <button class="dashed-add-btn" id="btn-add-facility" onclick="alert('Fungsi tambah fasilitas di JS menyusul')">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#183988" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          </button>
        </div>
      </div>
  
      <label class="section-label court-list-margin">Daftar Lapangan</label>
      <div id="courts-wrapper"></div>
        </div>
      <button id="btn-add-court" class="dashed-add-btn" style="margin-bottom: 40px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#183988" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </button>
      <div class="save-container">
          <button class="btn-save-venue" onclick="alert('Simpan semua perubahan JSON ke Backend')">Simpan Perubahan Venue</button>
      </div>
      
    </section>

    <section class="admin-panel admin-bookings-section">
      <h2>Manajemen Pesanan Baru</h2>
      
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Semua</button>
        <button class="tab-btn" data-filter="pending">Menunggu Pembayaran</button>
        <button class="tab-btn" data-filter="completed">Selesai</button>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Kode</th>
              <th>Pemesan</th>
              <th>Lapangan</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-bookings-table">
            </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
